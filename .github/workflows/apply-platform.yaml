name: Apply platform manifests

# Routing:
#   release (prerelease=false) -> apply overlays/prod
#   release (prerelease=true)  -> apply overlays/dev
#   workflow_dispatch          -> user picks mode (diff|apply) and env (dev|prod|both)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "apply or diff"
        required: true
        default: "diff"
        type: choice
        options: [diff, apply]
      env:
        description: "target environment"
        required: true
        default: "prod"
        type: choice
        options: [dev, prod, both]

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package manifests
        run: |
          set -euo pipefail
          tar czf platform.tgz platform apps overlays
          ls -la platform.tgz

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "platform.tgz"
          target: "/tmp/vm-${{ github.sha }}"

      - name: Apply on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_EVENT_NAME,GH_IS_PRERELEASE,DISPATCH_MODE,DISPATCH_ENV
          script: |
            set -euo pipefail
            DIR=/tmp/vm-${{ github.sha }}
            cd "$DIR" && tar xzf platform.tgz

            if [ "$GH_EVENT_NAME" = "release" ]; then
              MODE="apply"
              if [ "$GH_IS_PRERELEASE" = "true" ]; then
                ENV="dev"
              else
                ENV="prod"
              fi
            else
              MODE="$DISPATCH_MODE"
              ENV="$DISPATCH_ENV"
            fi
            echo "mode=$MODE env=$ENV"

            apply_or_diff() {
              local overlay="$1"
              if [ "$MODE" = "diff" ]; then
                sudo k3s kubectl diff -k "$overlay" || true
              else
                sudo k3s kubectl apply -k "$overlay"
              fi
            }

            # Platform (namespaces, cluster-issuer) is env-agnostic.
            if [ "$MODE" = "diff" ]; then
              sudo k3s kubectl diff -f platform/ || true
            else
              sudo k3s kubectl apply -f platform/
            fi

            case "$ENV" in
              dev)  apply_or_diff overlays/dev ;;
              prod) apply_or_diff overlays/prod ;;
              both) apply_or_diff overlays/prod; apply_or_diff overlays/dev ;;
              *) echo "unknown env: $ENV" >&2; exit 1 ;;
            esac
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_ENV: ${{ inputs.env }}
