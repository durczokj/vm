apiVersion: v1
kind: Service
metadata:
  name: vendor-manager-db
spec:
  clusterIP: None
  selector:
    app: vendor-manager-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vendor-manager-db
spec:
  serviceName: vendor-manager-db
  replicas: 1
  selector:
    matchLabels:
      app: vendor-manager-db
  template:
    metadata:
      labels:
        app: vendor-manager-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: vendor_manager
            - name: POSTGRES_USER
              value: vendor_manager
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vendor-manager-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "vendor_manager", "-d", "vendor_manager"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "vendor_manager", "-d", "vendor_manager"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
