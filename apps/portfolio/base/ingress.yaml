# Traefik requires Middleware refs to be "<namespace>-<name>@kubernetescrd" — the "prod-" prefix
# below is hard-coded because portfolio only ships to the prod overlay in Week 4. Move to an overlay
# patch if we ever add portfolio to overlays/dev.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: apex-to-portfolio-redirect
spec:
  redirectRegex:
    regex: ^https?://durczok\.ovh/.*
    replacement: https://portfolio.durczok.ovh/
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - portfolio.durczok.ovh
      secretName: portfolio-tls
  rules:
    - host: portfolio.durczok.ovh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-apex-redirect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: prod-apex-to-portfolio-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - durczok.ovh
      secretName: durczok-apex-tls
  rules:
    - host: durczok.ovh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
