apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vendor-manager-mcp-guardrails
spec:
  chain:
    middlewares:
      - name: vendor-manager-mcp-ratelimit
      - name: vendor-manager-mcp-buffer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vendor-manager-mcp-ratelimit
spec:
  rateLimit:
    average: 60
    period: 1m
    burst: 20
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vendor-manager-mcp-buffer
spec:
  buffering:
    maxRequestBodyBytes: 1048576
    memRequestBodyBytes: 1048576
